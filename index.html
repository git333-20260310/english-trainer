<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Trainer</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .topbar-actions{display:flex;align-items:center;gap:8px}.tool-link{min-height:40px;display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:8px;padding:0 12px;color:var(--accent);background:#fff;text-decoration:none;font-size:13px;font-weight:750;white-space:nowrap}@media(max-width:620px){.topbar-actions{align-items:stretch;flex-direction:column}.tool-link{justify-content:center}.topbar-actions button{min-width:0}}
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>English Trainer</h1>
          <p id="statusText">Loading...</p>
        </div>
        <div class="topbar-actions">
          <a class="tool-link" href="./youtube-loop.html">YouTubeリピート</a>
          <button id="resetButton" type="button">リセット</button>
        </div>
      </header>

      <nav id="sectionTabs" class="tabs" aria-label="セクション"></nav>

      <section class="controls" aria-label="出題設定">
        <div class="control-row">
          <label><input type="radio" name="mode" value="ja-en" checked /> 日本語→英語</label>
          <label><input type="radio" name="mode" value="en-ja" /> 英語→日本語</label>
          <label><input type="radio" name="mode" value="random" /> ランダム</label>
        </div>
        <div class="control-row">
          <label><input type="radio" name="filter" value="all" checked /> 全て</label>
          <label><input type="radio" name="filter" value="unlearned" /> 未チェック</label>
          <label><input type="radio" name="filter" value="review" /> 完璧以外</label>
        </div>
      </section>

      <section class="trainer" aria-live="polite">
        <div class="meta"><span id="counterText">0 / 0</span><span id="stateText">未チェック</span></div>
        <p id="promptText" class="prompt">Loading...</p>
        <div id="answerBox" class="answer" hidden>
          <p id="answerText"></p>
        </div>
        <div class="actions primary-actions">
          <button id="showButton" type="button">答えを見る</button>
          <button id="nextButton" type="button">次へ</button>
          <button id="randomButton" type="button">ランダム</button>
        </div>
        <div class="actions mark-actions">
          <button id="knownButton" type="button">覚えた</button>
          <button id="perfectButton" type="button">完璧</button>
          <button id="clearMarkButton" type="button">未チェックに戻す</button>
        </div>
        <button id="speechButton" class="speech" type="button">このカードを読み上げ選択</button>
      </section>
    </main>

    <script src="./app.js?v=20260519-1"></script>
  </body>
</html>
